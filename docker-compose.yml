services:
  api:
    build: .
    container_name: backend-amd-hacketon-api-1
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/amd_smart_product_assistant
      - AI_PROVIDER=groq
      # - VLLM_BASE_URL=http://165.245.138.77:8000
      # - VLLM_MODEL=meta-llama/Llama-3.2-3B-Instruct
      # - VLLM_API_KEY=47b8cf5c4af2ccde37b75be724c90dcf9847d11981614a9d43de12ff0928e4f5
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_BASE_URL=https://api.groq.com/openai/v1
      - GROQ_MODEL=llama-3.1-8b-instant
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    container_name: backend-amd-hacketon-db-1
    environment:
      - POSTGRES_DB=amd_smart_product_assistant
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
