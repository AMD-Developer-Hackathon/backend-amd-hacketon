name: Deploy FastAPI to VPS

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # 1. Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Free disk BEFORE build (PENTING)
      - name: Clean Docker system
        run: |
          docker system prune -a -f

      # 3. Stop old container safely
      - name: Stop old container
        run: |
          docker compose down || true

      # 4. Build & start fresh container
      - name: Build and Start Docker
        run: |
          docker compose up -d --build --force-recreate

      # 5. Show running containers
      - name: Check containers
        run: |
          docker ps

      # 6. Health check API (lebih proper)
      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8000/docs; then
              echo "API is up!"
              exit 0
            fi
            echo "Waiting for API..."
            sleep 5
          done

          echo "API failed to start"
          docker logs backend-amd-hacketon-api-1
          exit 1
